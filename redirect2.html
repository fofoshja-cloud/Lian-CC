<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparing Video...</title>
    
    <!-- كود الإعلان -->
    <script type='text/javascript' src='//pl25881432.genefinedcpm.com/de/3f/79/de3f790278bdc38ee2cfdf19ffbb1c7a.js'></script>
    
    <style>
        body { font-family: system-ui, sans-serif; background-color: #080b11; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; }
        .box { background: #111827; padding: 30px; border-radius: 16px; border: 1px solid #1f2937; max-width: 400px; width: 90%; }
        .timer { font-size: 2.5rem; font-weight: bold; color: #3b82f6; margin: 20px 0; }
        .btn { display: inline-block; padding: 14px 28px; background-color: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; }
        .btn:hover { background-color: #16a34a; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Preparing your video link...</h2>
        <div class="timer" id="countdown">5</div>
        <p id="waitText">Please wait a few seconds...</p>
        
        <!-- https://slicedrive.com/upload?v=SOz6qSZn1-->
        <a id="videoBtn" href="https://slicedrive.com/upload?v=SOz6qSZn1" target="_blank" class="btn" style="display: none;">Watch Video Now 🎬</a>
    </div>

    <script>
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        const waitTextEl = document.getElementById('waitText');
        const btnEl = document.getElementById('videoBtn');

        const timer = setInterval(() => {
            seconds--;
            countdownEl.innerText = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                countdownEl.style.display = 'none';
                waitTextEl.style.display = 'none';
                btnEl.style.display = 'inline-block';
            }
        }, 1000);
    </script>
</body>
</html>
