<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="f599610ff2392b0a0e08ae723a6fcc4f">
    <title>Watch video</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #070a12;
            color: #fff;
            min-height: 100vh;
            padding: 12px;
        }
        .layout {
            display: grid;
            grid-template-columns: 160px minmax(0, 1fr) 160px;
            gap: 14px;
            align-items: start;
            max-width: 1280px;
            margin: 0 auto;
        }
        .side-ad {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 160px;
            min-height: 450px;
            padding: 12px;
            background: #111827;
            border: 1px dashed #374151;
            border-radius: 10px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: 700;
            text-align: center;
        }
        .side-ad:hover { background: #1f2937; }
        .main {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .banner {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            min-height: 90px;
            padding: 12px;
            background: #111827;
            border: 1px dashed #3b82f6;
            border-radius: 10px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: 700;
        }
        .banner:hover { background: #1f2937; }
        .player {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 450px;
            background: #000;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow: hidden;
        }
        .player iframe {
            display: block;
            width: 100%;
            min-height: 450px;
            height: clamp(450px, 56.25vw, 560px);
            border: 0;
            background: #000;
        }
        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .side-ad {
                width: 100%;
                min-height: 90px;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <a href="https://omg10.com/4/11585338" target="_blank" rel="noopener" class="side-ad">Sponsored</a>

        <div class="main">
            <a href="https://omg10.com/4/11585338" target="_blank" rel="noopener" class="banner">Top banner — Sponsored</a>

            <div class="player">
                <iframe
                    src="https://voe.sx/e/hcq9kygzgevf"
                    width="100%"
                    allowfullscreen
                    allowtransparency
                    allow="autoplay; encrypted-media; picture-in-picture"
                    scrolling="no"
                    frameborder="0"
                    title="Video player"
                ></iframe>
            </div>

            <a href="https://omg10.com/4/11585338" target="_blank" rel="noopener" class="banner">Bottom banner — Sponsored</a>
        </div>

        <a href="https://omg10.com/4/11585338" target="_blank" rel="noopener" class="side-ad">Sponsored</a>
    </div>
</body>
</html>
