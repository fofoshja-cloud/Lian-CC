<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="f599610ff2392b0a0e08ae723a6fcc4f">
    <title>تجهيز الفيديو...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #070a12; color: #ffffff; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        .container { width: 100%; max-width: 850px; display: flex; flex-direction: column; align-items: center; gap: 15px; text-align: center; }
        
        /* إعلانات البنر المحيطة */
        .ad-box { width: 100%; background: #1f2937; border: 1px dashed #3b82f6; padding: 14px; border-radius: 8px; color: #60a5fa; font-weight: bold; text-decoration: none; display: block; }
        .ad-box:hover { background: #374151; }

        /* منطقة العداد التنازلي */
        .timer-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 25px; width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .timer-text { font-size: 18px; color: #f59e0b; margin-bottom: 15px; font-weight: bold; }
        
        /* منطقة المشغل */
        .player-card { width: 100%; display: none; flex-direction: column; gap: 15px; }
        .player-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid #1f2937; }
        .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- إعلان محيط علوي -->
        <a href="https://omg10.com/4/11585338" target="_blank" class="ad-box">🔥 إعلان: اضغط هنا لتسريع السيرفر وتخطي الإعلانات</a>

        <!-- العداد التنازلي -->
        <div id="timerCard" class="timer-card">
            <div class="timer-text">جاري تجهيز السيرفر... انتظر (<span id="seconds">5</span>) ثوانٍ</div>
            <a href="https://omg10.com/4/11585338" target="_blank" class="ad-box">⚠️ انقر هنا لتجهيز الرابط فوراً</a>
        </div>

        <!-- المشغل المحاط بالإعلانات (يحمل بعد 5 ثوانٍ) -->
        <div id="playerCard" class="player-card">
            <a href="https://omg10.com/4/11585338" target="_blank" class="ad-box">▶ اضغط هنا لمشاهدة الفيديو بجودة HD في نافذة مستقلة</a>
            
            <div class="player-wrapper">
                <iframe src="https://voe.sx/e/hcq9kygzgevf" allowfullscreen allowtransparency allow="autoplay; encrypted-media; picture-in-picture" scrolling="no" frameborder="0"></iframe>
            </div>

            <!-- إعلان محيط سفلي -->
            <a href="https://omg10.com/4/11585338" target="_blank" class="ad-box">📢 سيرفرات تحميل مباشرة وصريحة اضغط هنا</a>
        </div>
    </div>

    <script>
        let timeLeft = 5;
        const secondsElem = document.getElementById('seconds');
        const timerCard = document.getElementById('timerCard');
        const playerCard = document.getElementById('playerCard');

        const timer = setInterval(() => {
            timeLeft--;
            secondsElem.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                timerCard.style.display = 'none';
                playerCard.style.display = 'flex';
            }
        }, 1000);
    </script>
</body>
</html>
