<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="f599610ff2392b0a0e08ae723a6fcc4f">

    <script>(function(s){s.dataset.zone='11641405',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <title>Preparing Streaming Server...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #080b11;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .card {
            width: 100%;
            max-width: 650px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.55);
        }
        h2 { font-size: 1.2rem; color: #94a3b8; margin-bottom: 12px; }

        /* منطقة الإعلان والعداد أثناء الـ 5 ثواني */
        .ad-container {
            margin: 15px 0;
            padding: 15px;
            background: #1e293b;
            border: 1px dashed #3b82f6;
            border-radius: 12px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .ad-banner-link {
            display: block;
            width: 100%;
            text-decoration: none;
            color: #fff;
        }

        .timer-box {
            font-size: 2.8rem;
            font-weight: 800;
            color: #3b82f6;
            margin: 10px 0;
        }
        .timer-text { color: #64748b; font-size: 0.85rem; }

        /* مشغل الفيديو المخفي */
        .video-wrapper {
            display: none;
            width: 100%;
            position: relative;
            padding-bottom: 56.25%; /* نسبة 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- مرحلة العداد والإعلانات (تختفي بعد 5 ثوان) -->
        <div id="waitScreen">
            <h2>Preparing high speed stream...</h2>
            
            <div class="timer-box" id="countdown">5</div>
            <div class="timer-text">Please wait 5 seconds while we load your video</div>

            <!-- مكان كود إعلان Adsterra أو البنر الإعلاني -->
            <div class="ad-container">
                <a href="https://omg10.com/4/11585338" target="_blank" rel="noopener" class="ad-banner-link">
                    <p style="color: #93c5fd; font-size: 0.8rem; margin-bottom: 8px;">SPONSORED ADVERTISEMENT</p>
                    <div style="background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155;">
                        <h3 style="color: #60a5fa; font-size: 1.1rem; margin-bottom: 6px;">⚡ Ultra Fast HD Player</h3>
                        <p style="color: #cbd5e1; font-size: 0.85rem;">Click here to unlock 4K streaming access</p>
                    </div>
                </a>
                <!-- إذا كان لديك كود Adsterra Script ضع الشفرة هنا مستقبلاً -->
            </div>
        </div>

        <!-- مشغل الفيديو الحقيقي (يظهر بعد 5 ثوان) -->
        <div class="video-wrapper" id="videoContainer">
            <iframe src="https://voe.sx/e/nssowoxk9dmc" allowfullscreen allowtransparency allow="autoplay" scrolling="no"></iframe>
        </div>
    </div>

    <script>
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');
        const waitScreen = document.getElementById('waitScreen');
        const videoContainer = document.getElementById('videoContainer');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                // إخفاء شاشة الإعلانات والعداد بالكامل
                waitScreen.style.display = 'none';
                
                // إظهار مشغل VOE ليتفاعل معه الزائر فوراً
                videoContainer.style.display = 'block';
            }
        }, 1000);
    </script>

</body>
</html>
