<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .timer {
            font-size: 48px;
            font-weight: bold;
            color: #38bdf8;
            margin: 20px 0;
        }

        .btn-green {
            display: inline-block;
            background-color: #22c55e;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
            cursor: pointer;
            border: none;
            width: 80%;
        }

        .btn-green:hover {
            background-color: #16a34a;
        }

        .btn-disabled {
            background-color: #475569;
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.6;
        }

        .ad-box {
            margin: 20px 0;
            padding: 10px;
            background-color: #0f172a;
            border: 1px dashed #334155;
            border-radius: 8px;
        }

        .video-wrapper {
            display: none;
            margin-top: 20px;
            width: 100%;
            position: relative;
            padding-bottom: 56.25%; /* نسبة العرض للارتفاع 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Please Wait...</h2>
        <p>Your video link is being prepared.</p>

        <!-- مكان بنر الإعلان (Monetag) -->
        <div class="ad-box">
            <!-- شفرة الإعلانات البنر الخاصة بك توضع هنا -->
            <p style="color: #64748b; font-size: 14px;">Advertisement</p>
        </div>

        <!-- العداد التنازلي -->
        <div class="timer" id="countdown">3</div>

        <!-- مشغل الفيديو (يكون مخفياً ويسحب عند انتهاء العد) -->
        <div class="video-wrapper" id="videoContainer">
            <iframe src="https://voe.sx/e/hcq9kygzgevf" allowfullscreen allowtransparency allow="autoplay" scrolling="no"></iframe>
        </div>

        <!-- زر التشغيل المباشر -->
        <a href="https://voe.sx/e/hcq9kygzgevf" class="btn-green btn-disabled" id="watchBtn" target="_blank">Please Wait... 🎬</a>
    </div>

    <script>
        let timeLeft = 3;
        const countdownEl = document.getElementById('countdown');
        const watchBtn = document.getElementById('watchBtn');
        const videoContainer = document.getElementById('videoContainer');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.style.display = 'none'; // إخفاء العداد
                
                // تفعيل الزر
                watchBtn.classList.remove('btn-disabled');
                watchBtn.textContent = 'Watch Video Now 🎬';

                // إظهار المشغل داخل الصفحة
                videoContainer.style.display = 'block';
            }
        }, 1000);
    </script>

</body>
</html>
