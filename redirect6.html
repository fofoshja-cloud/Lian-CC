    <title>Preparing Stream - Server 6</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #080b11;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;

        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.55);
        }
        h1 { font-size: 1.25rem; color: #60a5fa; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        .ad-box {
            display: block;
            margin: 16px 0;
            padding: 16px;
            background: #1f2937;
            border: 1px dashed #3b82f6;
            border-radius: 10px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: 700;
            transition: background 0.2s;
        }
        .ad-box:hover { background: #374151; }
        .btn-continue {
            display: none;
            width: 100%;
            padding: 14px;
            background: #238636;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-continue:hover { background: #2ea043; }
        .timer { font-size: 1.1rem; font-weight: 600; color: #f59e0b; margin: 15px 0; }

<body>
    <div class="card">
        <h1>Preparing Stream Link</h1>

        <a href="https://omg10.com/4/11585338" target="_blank" rel="noopener" class="ad-box">
            Sponsored Offer — Click to Open
        </a>

        <div class="timer" id="timer-text">Ready in <span id="count">3</span> seconds...</div>
        <a href="https://omg10.com/4/11585338" id="go-btn" class="btn-continue">Go to Stream Link</a>

        <a href="https://omg10.com/4/11585338" target="_blank" rel="noopener" class="ad-box" style="margin-top: 20px;">
            Bottom Banner — Special Deal
        </a>
    </div>

    <script>
        let time = 3;
        const countElem = document.getElementById('count');
        const timerText = document.getElementById('timer-text');
        const goBtn = document.getElementById('go-btn');

        const timer = setInterval(() => {
            time--;
            countElem.textContent = time;
            if (time <= 0) {
                clearInterval(timer);
                timerText.style.display = 'none';
                goBtn.style.display = 'block';
            }
        }, 1000);
    </script>
