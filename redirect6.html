<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>(function(s){s.dataset.zone='11641405',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <title>Preparing your video link...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #080b11;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.55);
        }
        h1 { font-size: 1.3rem; color: #fff; margin-bottom: 20px; }
        
        /* حاوي البنر الإعلاني الثابت */
        .ad-banner {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            display: block;
        }
        .ad-banner img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* العداد التنازلي */
        .timer-box {
            margin: 10px 0;
        }
        .timer-num {
            font-size: 2.2rem;
            font-weight: 800;
            color: #3b82f6;
        }
        .timer-text {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* زر التشغيل الأخضر */
        .btn-green {
            display: none;
            width: 100%;
            padding: 16px;
            background: #22c55e;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-green:hover { background: #16a34a; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Preparing your video link...</h1>

        <!-- الإعلان المصور الثابت (قابل للنقر لتحقيق الربح) -->
        <a href="https://omg10.com/4/11585338" target="_blank" rel="noopener" class="ad-banner">
            <img src="https://via.placeholder.com/350x280/0f172a/60a5fa?text=XM+App+Bonus+Download" alt="Sponsor Banner">
        </a>

        <!-- العداد التنازلي -->
        <div class="timer-box" id="timerContainer">
            <div class="timer-num" id="countdown">3</div>
            <div class="timer-text">Please wait a few seconds...</div>
        </div>

        <!-- زر التشغيل المباشر بعد انتهاء العد -->
        <a href="https://omg10.com/4/11585338" class="btn-green" id="watchBtn">Watch Video Now 🎬</a>
    </div>

    <script>
        let timeLeft = 3;
        const countdownEl = document.getElementById('countdown');
        const timerContainer = document.getElementById('timerContainer');
        const watchBtn = document.getElementById('watchBtn');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                timerContainer.style.display = 'none';
                watchBtn.style.display = 'block';
            }
        }, 1000);
    </script>
</body>
</html>
