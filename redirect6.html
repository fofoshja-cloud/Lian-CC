<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="f599610ff2392b0a0e08ae723a6fcc4f">
    <title>Videy.co | Server Direct</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #080b11; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { text-align: center; max-width: 440px; width: 100%; padding: 25px; background: #111827; border-radius: 16px; border: 1px solid #1f2937; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 2.2rem; font-weight: 800; color: #3b82f6; margin-bottom: 4px; }
        .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 15px; }
        .ad-box { width: 100%; max-width: 300px; height: 250px; background: #1f2937; border-radius: 10px; margin: 15px 0; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 1px solid #374151; text-decoration: none; color: #60a5fa; font-weight: bold; }
        .timer-box { font-size: 1.8rem; font-weight: bold; color: #f59e0b; margin: 10px 0; }
        .btn { display: inline-block; width: 100%; padding: 14px 0; background-color: #2563eb; color: white; text-decoration: none; font-weight: bold; border-radius: 8px; font-size: 1.1rem; transition: background 0.3s; }
        .btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Videy.co</div>
        <div class="subtitle">Connecting to high-speed server...</div>

        <!-- إعلان Monetag -->
        <a href="https://omg10.com/4/11585338" target="_blank" class="ad-box">
            ▶ Sponsored Content (Click to Skip)
        </a>

        <div id="timer" class="timer-box">Connecting in 5...</div>

        <!-- الزر يوجه الآن مباشرة إلى watch.html الذي يحتوي على فيديو VOE الجديد -->
        <a id="videoBtn" href="watch.html" class="btn" style="display: none;">Watch Video Now 🎬</a>
    </div>

    <script>
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');
        const videoBtn = document.getElementById('videoBtn');

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                timerElement.textContent = `Connecting in ${timeLeft}...`;
            } else {
                clearInterval(countdown);
                timerElement.style.display = 'none';
                videoBtn.style.display = 'block';
            }
        }, 1000);
    </script>

</body>
</html>
