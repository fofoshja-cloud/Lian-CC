<head>

    <title>Preparing Stream - Server 6</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #080b11;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.55);
        }
        h1 { font-size: 1.25rem; color: #60a5fa; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        
        /* تصميم البنر المرئي */
        .banner-ad {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            text-decoration: none;
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
            transition: transform 0.2s;
        }
        .banner-ad:hover { transform: scale(1.02); }
        .banner-content { text-align: left; }
        .banner-title { font-size: 0.95rem; font-weight: bold; color: #60a5fa; }
        .banner-desc { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }
        .banner-btn {
            background: #2563eb;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-continue {
            display: none;
            width: 100%;
            padding: 14px;
            background: #238636;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-continue:hover { background: #2ea043; }
        .timer { font-size: 1.1rem; font-weight: 600; color: #f59e0b; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Preparing Stream Link</h1>
        <p class="subtitle">Please wait while the server prepares your video</p>

        <!-- البنر العلوي التفاعلي -->
        <a href="https://omg10.com/4/11585338" target="_blank" rel="noopener" class="banner-ad">
            <div class="banner-content">
                <div class="banner-title">⚡ Fast HD Streaming Sponsor</div>
                <div class="banner-desc">Click here to unlock 1080p high speed</div>
            </div>
            <div class="banner-btn">OPEN</div>
        </a>

        <div class="timer" id="timer-text">Ready in <span id="count">3</span> seconds...</div>
        <a href="https://omg10.com/4/11585338" id="go-btn" class="btn-continue">Go to Stream Link</a>

        <!-- البنر السفلي التفاعلي -->
        <a href="https://omg10.com/4/11585338" target="_blank" rel="noopener" class="banner-ad" style="margin-top: 20px;">
            <div class="banner-content">
                <div class="banner-title">🎁 Special Offer for Viewers</div>
                <div class="banner-desc">Sponsored content • Tap to check</div>
            </div>
            <div class="banner-btn">VIEW</div>
        </a>
    </div>

    <script>
        let time = 3;
        const countElem = document.getElementById('count');
        const timerText = document.getElementById('timer-text');
        const goBtn = document.getElementById('go-btn');

        const timer = setInterval(() => {
            time--;
            countElem.textContent = time;
            if (time <= 0) {
                clearInterval(timer);
                timerText.style.display = 'none';
                goBtn.style.display = 'block';
            }
        }, 1000);
    </script>
</body>
</html>
