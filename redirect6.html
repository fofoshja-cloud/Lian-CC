        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #080b11;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 500px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.55);
        }
        h1 { font-size: 1.3rem; color: #fff; margin-bottom: 4px; }
        .subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }

        .ad-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .ad-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 10px;
            background: #1e293b;
            border: 1px dashed #3b82f6;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            transition: all 0.2s ease;
        }
        .ad-box:hover {
            background: #2563eb;
            border-color: #60a5fa;
            transform: translateY(-2px);
        }
        .ad-tag {
            font-size: 0.65rem;
            color: #94a3b8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .ad-box:hover .ad-tag { color: #e2e8f0; }
        .ad-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #60a5fa;
        }
        .ad-box:hover .ad-title { color: #fff; }

        .btn-main {
            display: block;
            width: 100%;
            padding: 16px;
            background: #238636;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            margin: 16px 0;
            transition: background 0.2s;
        }
        .btn-main:hover { background: #2ea043; }
    </style>
</head>
