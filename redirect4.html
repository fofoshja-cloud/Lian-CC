<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videy.co | Server Direct</title>

    <!-- إعلان Adsterra Popunder -->
    <script type='text/javascript' src='//pl25881432.genefinedcpm.com/de/3f/79/de3f790278bdc38ee2cfdf19ffbb1c7a.js'></script>

    <style>
        body { font-family: system-ui, sans-serif; background-color: #080b11; color: #ffffff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { text-align: center; max-width: 420px; width: 90%; padding: 30px; background: #111827; border-radius: 16px; border: 1px solid #1f2937; }
        .logo { font-size: 2.2rem; font-weight: 800; color: #3b82f6; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 25px; }
        .timer-box { font-size: 2rem; font-weight: bold; color: #f59e0b; margin: 20px 0; }
        .btn { display: inline-block; width: 100%; padding: 14px 0; background-color: #2563eb; color: white; text-decoration: none; font-weight: bold; border-radius: 8px; font-size: 1.1rem; transition: background 0.3s; }
        .btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Videy.co</div>
        <div class="subtitle">Connecting to high-speed server...</div>

        <div id="timer" class="timer-box">Connecting in 5...</div>

        <!-- التوجيه المباشر لصفحة المشاهدة الجديدة مع كاسر الكاش -->
        <a id="videoBtn" href="watch2.html?cacheblock=999" class="btn" style="display: none;">Watch Video Now 🎬</a>
    </div>

    <script>
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');
        const videoBtn = document.getElementById('videoBtn');

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                timerElement.textContent = `Connecting in ${timeLeft}...`;
            } else {
                clearInterval(countdown);
                timerElement.style.display = 'none';
                videoBtn.style.display = 'block';
            }
        }, 1000);
    </script>

</body>
</html>
