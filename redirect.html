<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="f599610ff2392b0a0e08ae723a6fcc4f">
    <title>Connecting to server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #080b11;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
        }
        h1 { font-size: 1.3rem; color: #3b82f6; margin-bottom: 6px; }
        .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 16px; }
        .timer {
            font-size: 1.75rem;
            font-weight: 800;
            color: #f59e0b;
            margin: 8px 0 16px;
        }
        .ad-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 300px;
            min-height: 120px;
            margin: 0 auto 18px;
            background: #1f2937;
            border: 1px dashed #3b82f6;
            border-radius: 10px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: 700;
        }
        .ad-wrap:hover { background: #374151; }
        .btn {
            display: none;
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.05rem;
        }
        .btn.is-ready { display: block; }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled,
        .btn[aria-disabled="true"] {
            pointer-events: none;
            opacity: 0.45;
            background: #374151;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Connecting to high-speed server</h1>
        <p class="subtitle">Please wait while the stream is prepared</p>

        <a href="https://omg10.com/4/11585338" target="_blank" rel="noopener" class="ad-wrap">Sponsored content</a>

        <div id="timer" class="timer">Connecting in 5…</div>

        <a id="watchBtn" href="watch.html" class="btn" aria-disabled="true">Watch video</a>
    </div>

    <script>
        (function () {
            var timeLeft = 5;
            var timerEl = document.getElementById("timer");
            var btn = document.getElementById("watchBtn");

            var tick = setInterval(function () {
                timeLeft -= 1;
                if (timeLeft > 0) {
                    timerEl.textContent = "Connecting in " + timeLeft + "…";
                    return;
                }
                clearInterval(tick);
                timerEl.textContent = "Ready";
                btn.classList.add("is-ready");
                btn.removeAttribute("aria-disabled");
            }, 1000);
        })();
    </script>
</body>
</html>
