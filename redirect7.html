<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparing High Speed Stream...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #070b12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        /* تنسيق الحاويات الإعلانية General Ad Placeholders */
        .ad-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            overflow: hidden;
            margin: 10px 0;
        }

        .ad-top, .ad-bottom {
            width: 100%;
            max-width: 970px;
            min-height: 90px;
        }

        .ad-side {
            width: 160px;
            min-height: 600px;
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
        }

        .ad-left { left: 10px; }
        .ad-right { right: 10px; }

        /* البطاقة الرئيسية التي تحتوي العداد والفيديو */
        .main-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            z-index: 10;
        }

        .card {
            width: 100%;
            background: linear-gradient(145deg, rgba(17,24,39,.98), rgba(10,15,25,.98));
            border: 1px solid rgba(148,163,184,.12);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.55);
        }

        h2 { font-size: 1.2rem; color: #94a3b8; margin-bottom: 12px; }
        
        .timer-box {
            font-size: 2.8rem;
            font-weight: 800;
            color: #3b82f6;
            margin: 10px 0;
        }
        .timer-text { color: #64748b; font-size: 0.85rem; margin-bottom: 20px; }

        .video-wrapper {
            display: none;
            width: 100%;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid rgba(148,163,184,.14);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }

        /* إخفاء إعلانات الجوانب على الشاشات الصغيرة لتجنب تغطية المحتوى */
        @media (max-width: 1150px) {
            .ad-side { display: none; }
        }
    </style>
</head>
<body>

    <!-- إعلان 1: إعلان علوي عريض (Top Leaderboard) -->
    <div class="ad-slot ad-top">
        <!-- ضع كود Adsterra هنا (مثلاً مقاس 728x90 أو 468x60) -->
    </div>

    <!-- إعلان 2: إعلان جانبي أيسر (Left Skyscraper) -->
    <div class="ad-slot ad-side ad-left">
        <!-- ضع كود Adsterra هنا (مقاس 160x600) -->
    </div>

    <!-- إعلان 3: إعلان جانبي أيمن (Right Skyscraper) -->
    <div class="ad-slot ad-side ad-right">
        <!-- ضع كود Adsterra هنا (مقاس 160x600) -->
    </div>

    <div class="main-wrapper">
        <div class="card">
            <div id="waitScreen">
                <h2>Preparing high speed stream...</h2>
                <div class="timer-box" id="countdown">5</div>
                <div class="timer-text">Please wait 5 seconds while we load your video</div>

                <!-- إعلان 4: إعلان أوسط تحت العداد (In-Card Banner) -->
                <div class="ad-slot" style="min-height:250px;">
                    <!-- ضع كود Adsterra هنا (مقاس 300x250) -->
                </div>
            </div>

            <div class="video-wrapper" id="videoContainer">
                <iframe src="https://voe.sx/e/hcq9kygzgevf" allowfullscreen allowtransparency allow="autoplay" scrolling="no"></iframe>
            </div>
        </div>

        <!-- إعلان 5: إعلان سفلي تحت الفيديو/الكارت (Bottom Banner) -->
        <div class="ad-slot ad-bottom">
            <!-- ضع كود Adsterra هنا (مثلاً مقاس 728x90 أو 300x250) -->
        </div>
    </div>

    <script>
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');
        const waitScreen = document.getElementById('waitScreen');
        const videoContainer = document.getElementById('videoContainer');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                waitScreen.style.display = 'none';
                videoContainer.style.display = 'block';
            }
        }, 1000);
    </script>

</body>
</html>
