<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparing High Speed Stream...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #070b12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .card {
            width: 100%;
            max-width: 650px;
            background: linear-gradient(145deg, rgba(17,24,39,.98), rgba(10,15,25,.98));
            border: 1px solid rgba(148,163,184,.12);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.55);
        }
        h2 { font-size: 1.2rem; color: #94a3b8; margin-bottom: 12px; }
        .timer-box {
            font-size: 2.8rem;
            font-weight: 800;
            color: #3b82f6;
            margin: 10px 0;
        }
        .timer-text { color: #64748b; font-size: 0.85rem; margin-bottom: 20px; }
        .video-wrapper {
            display: none;
            width: 100%;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid rgba(148,163,184,.14);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="waitScreen">
            <h2>Preparing high speed stream...</h2>
            <div class="timer-box" id="countdown">5</div>
            <div class="timer-text">Please wait 5 seconds while we load your video</div>
        </div>

        <div class="video-wrapper" id="videoContainer">
            <!-- ضع رابط فيديو VOE الجديد هنا داخل src -->
            <iframe src="https://voe.sx/e/hcq9kygzgevf" allowfullscreen allowtransparency allow="autoplay" scrolling="no"></iframe>
        </div>
    </div>

    <script>
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');
        const waitScreen = document.getElementById('waitScreen');
        const videoContainer = document.getElementById('videoContainer');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                waitScreen.style.display = 'none';
                videoContainer.style.display = 'block';
            }
        }, 1000);
    </script>

</body>
</html>
