<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الفيديو | Videy.co</title>
    <style>
        body { 
            background-color: #080b11; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        .video-container { 
            width: 100%; 
            max-width: 800px; 
            background: #111827; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 0 25px rgba(0,0,0,0.6); 
        }

        iframe { 
            width: 100%; 
            height: 450px; 
            border: none; 
            border-radius: 8px; 
        }

        h1 { 
            font-size: 1.5rem; 
            margin-top: 15px; 
            margin-bottom: 5px;
            font-weight: 700;
            color: #ffffff;
            text-align: right;
        }

        .description {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 15px;
            text-align: right;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .btn-secondary {
            padding: 8px 16px;
            border-radius: 6px;
            background: #1f2937;
            color: #fff;
            border: 1px solid #374151;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: #374151;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- تضمين رابط فيديو SliceDrive المباشر -->
        <iframe src="https://slicedrive.com/upload?v=b2kt7cOg1" allowfullscreen></iframe>

        <h1>مشاهدة الفيديو الحصري</h1>
        <p class="description">نتمنى لك مشاهدة ممتعة!</p>

        <div class="action-buttons">
            <a href="https://t.me/YourChannel" target="_blank" class="btn-secondary">انضم لقناتنا على تيليجرام</a>
        </div>
    </div>

</body>
</html>
